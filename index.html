                        plant: baseInfo.plant,
                        desc: baseInfo.note,
                        risk: baseInfo.risk,
                        status: "confirmed"
                    });
                    return;
                }

                if (baseInfo.type === "complex") {
                    if (selectedTownInfo) {
                        // 町名判定
                        let riskLevel = "warning";
                        if (selectedTownInfo.type === "high") riskLevel = "high";
                        if (selectedTownInfo.type === "nishihara") riskLevel = "high";

                        if (selectedTownInfo.type === "safe") riskLevel = "safe";
                        if (selectedTownInfo.type === "mixed") riskLevel = "warning";

                            plant: selectedTownInfo.plant,
                            desc: selectedTownInfo.desc,
                            risk: riskLevel,
                            status: "confirmed"
                        });
                    } else {

                        setResult({ status: "waiting" });
                    }
                }

                            bgColor: "bg-yellow-50",
                            borderColor: "border-yellow-200",
                            title: "一部影響の可能性あり",
                            message: "西原系と北谷系が混在する地域、または境界付近のエリアです。"
                        };
                    case "low":
                        return {
                            icon: "check-circle",
                            color: "bg-blue-500",
                            textColor: "text-blue-700",
                            bgColor: "bg-blue-50",
                            borderColor: "border-blue-200",
                            title: "断水リスク：低",
                            message: "影響の出ない「北谷浄水場」または「名護浄水場」が主な水源です。"
                        };
                    case "safe":
                        return {
                            icon: "shield-check",
                            color: "bg-green-600",
                            textColor: "text-green-800",
                            bgColor: "bg-green-50",
                            borderColor: "border-green-200",
                            title: "影響なし (報道・確認済)",
                            message: "ニュース報道等により「影響が出ない見通し」または「断水しない」ことが確認されています。"
                        };
                    default:
                        return {};
                }
            };

            return (
                <div className="min-h-screen p-4 sm:p-6 flex flex-col items-center max-w-2xl mx-auto">
                    
                    {/* Title */}
                    <div className="text-center mb-6">
                        <h1 className="text-2xl font-black text-gray-800 flex items-center justify-center gap-2">
                            <i data-lucide="activity" className="text-red-500 fill-current"></i>
                            水源・断水リスク判定くん
                        </h1>
                        <p className="text-sm text-gray-500 mt-1">「私の家は大丈夫？」を詳細データでチェック</p>
                    </div>

                    {/* Main Interface */}
                    <div className="w-full bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
                        
                        {/* Step 1: City Selection */}
                        <div className="p-6 bg-slate-50 border-b border-slate-100">
                            <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">
                                1. 市町村を選ぶ
                            </label>
                            <div className="relative">
                                <select 
                                    value={selectedCity}
                                    onChange={(e) => setSelectedCity(e.target.value)}
                                    className="w-full p-4 pl-4 pr-10 rounded-xl border border-gray-300 shadow-sm text-lg font-bold text-gray-800 focus:ring-2 focus:ring-blue-500 outline-none bg-white appearance-none"
                                >
                                    <option value="">▼ 選択してください</option>
                                    {cities.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                                <i data-lucide="chevron-down" className="absolute right-4 top-5 text-gray-400 pointer-events-none"></i>
                            </div>
                        </div>

                        {/* Step 2: Town Selection */}
                        {selectedCity && MUNICIPALITY_BASE[selectedCity].type === "complex" && (
                            <div className="p-6 bg-white animate-fade-in border-b border-gray-100">
                                <label className="block text-xs font-bold text-blue-600 uppercase tracking-wider mb-2 flex items-center">
                                    2. 町名を選ぶ <span className="ml-2 bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full text-[10px]">詳細判定</span>
                                </label>
                                <div className="relative">
                                    <select 
                                        value={selectedTownInfo ? selectedTownInfo.name : ""}
                                        onChange={(e) => {
                                            const town = MUNICIPALITY_BASE[selectedCity].list.find(t => t.name === e.target.value);
                                            setSelectedTownInfo(town);
                                        }}
                                        className="w-full p-4 pl-4 pr-10 rounded-xl border-2 border-blue-100 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none text-lg transition-all appearance-none cursor-pointer hover:border-blue-300"
                                    >
                                        <option value="">▼ 町名を選択してください</option>
                                        {MUNICIPALITY_BASE[selectedCity].list.sort((a,b) => a.name.localeCompare(b.name, 'ja')).map(town => (
                                            <option key={town.name} value={town.name}>
                                                {town.name}
                                            </option>
                                        ))}
                                    </select>
                                    <i data-lucide="chevron-down" className="absolute right-4 top-5 text-gray-400 pointer-events-none"></i>
                                </div>
                                <p className="text-[10px] text-gray-400 mt-2 ml-1">
                                    ※公式の詳細資料に基づいています
                                </p>
                            </div>
                        )}

                        {/* Step 3: Result Display */}
                        {result && result.status !== "waiting" ? (
                            (() => {
                                const ui = getRiskUI(result.risk);
                                return (
                                    <div className="p-8 text-center slide-down">
                                        
                                        {/* Status Badge */}
                                        <div className={`inline-flex items-center justify-center p-3 rounded-full ${ui.color} text-white mb-4 shadow-lg ${result.risk.includes('high') ? 'pulse-warning' : ''}`}>
                                            <i data-lucide={ui.icon} className="w-8 h-8"></i>
                                        </div>

                                        <h2 className={`text-xl font-bold mb-2 ${ui.textColor}`}>
                                            {ui.title}
                                        </h2>

                                        <div className="text-2xl sm:text-3xl font-black text-gray-800 mb-6 leading-tight">
                                            {result.plant}
                                        </div>

                                        <div className={`p-5 rounded-xl text-left text-sm leading-relaxed border ${ui.bgColor} ${ui.borderColor} ${ui.textColor}`}>
                                            <div className="font-bold mb-1 flex items-center">
                                                <i data-lucide="info" className="w-4 h-4 mr-2"></i>
                                                判定根拠
                                            </div>
                                            {ui.message}
                                            <div className="mt-2 pt-2 border-t border-gray-200/50 opacity-80 text-xs">
                                                ※ {result.desc}
                                            </div>
                                        </div>
                                        
                                        {/* Direct Link to News Search */}
                                        <div className="mt-6">
                                            <a 
                                                href="https://www.google.com/search?q=%E6%B2%96%E7%B8%84+%E6%96%AD%E6%B0%B4+%E6%9C%80%E6%96%B0%E6%83%85%E5%A0%B1" 
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                className="inline-flex items-center justify-center w-full px-4 py-3 bg-gray-800 text-white rounded-xl font-bold hover:bg-gray-700 transition-colors"
                                            >
                                                <i data-lucide="search" className="w-4 h-4 mr-2"></i>
                                                最新ニュースを確認する
                                            </a>
                                        </div>

                                    </div>
                                );
                            })()
                        ) : (
                             selectedCity && (
                                <div className="p-8 text-center text-gray-400 flex flex-col items-center">
                                    <i data-lucide="arrow-up-circle" className="w-8 h-8 mb-2 opacity-50"></i>
                                    町名を選択すると判定が表示されます
                                </div>
                            )
                        )}
                    </div>

                    {/* Disclaimer Footer */}
                    <div className="mt-6 px-4 pb-4">
                        <div className="bg-gray-50 rounded-lg p-4 border border-gray-100 text-center">
                            <p className="text-xs text-gray-500 leading-relaxed mb-2">
                                ※本アプリは個人が急遽作成した簡易的なものであり、情報が正確でない可能性があります。
                            </p>
                            <p className="text-xs text-gray-600 font-bold">
                                正確な断水状況や給水区域については、必ず各市町村の公式サイトや窓口へお問い合わせください。
                            </p>
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
